<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB Average · 3 Years</title><style>
:root{font-family:Arial,sans-serif;color:#fff;background:#060a19}*{box-sizing:border-box}body{margin:0;padding:18px}header{text-align:center;margin:10px 0 24px}h1{font-size:clamp(22px,3vw,32px);font-weight:500;margin:0}header p{color:#f2b930;font-size:12px;margin:8px}.status{text-align:center;color:#9bb3d6;font-size:12px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.tile{border:0;background:#bce1ee;color:#0626b6;padding:0 0 13px;cursor:pointer;min-height:115px;overflow:hidden}.tile strong{display:block;background:#1124aa;color:white;padding:10px 3px;font-size:14px}.tile.active strong{background:#12669c}.tile.active{background:#324c69;color:white}.metric{margin-top:14px;display:flex;justify-content:center;align-items:baseline;gap:5px;flex-wrap:wrap}.metric b{font-size:19px}.metric small{font-size:10px;color:#42596d}.tile.active .metric small{color:white}.metric.suggest b{color:#008a75}.tile.active .metric.suggest b{color:#6ee5d1}.detail{background:#15213b;margin-top:15px;padding:18px;overflow:auto}.detail h2{font-size:16px;margin:0 0 10px}.summary{color:#ffd14a;font-size:17px;margin:8px 0 14px}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{color:#8dc8ee;font-weight:400}td,th{padding:7px;border-bottom:1px solid #2a3b56}td.points{color:#3edfc9}footer{font-size:12px;color:#b4c4d7;line-height:1.5;margin-top:16px}@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){body{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tile{min-height:125px}.metric b{font-size:20px}.detail{padding:12px}table{font-size:11px}td,th{padding:6px 3px}}
</style></head><body><header><h1>MB AVERAGE | TOP 5 DAILY RANGES</h1><p>28 PAIRS · LAST 3 YEARS · CLOSED D1 CANDLES</p></header><p id="status" class="status">正在读取数据…</p><main id="grid" class="grid"></main><section class="detail" id="detail"><h2>选择货币对查看 Top 5 日线波动</h2></section><footer>数据来源：Yahoo Finance（非官方接口）；每天计划自动更新，实际可能延迟或失败。数据与 Tradehall MT5 的报价、日线切分时间及 point 定义可能不同。仅供参考，不是交易信号。</footer><script>
const PAIRS='AUDCAD AUDCHF AUDJPY AUDNZD AUDUSD CADCHF CADJPY CHFJPY EURAUD EURCAD EURCHF EURGBP EURJPY EURNZD EURUSD GBPAUD GBPCAD GBPCHF GBPJPY GBPNZD GBPUSD NZDCAD NZDCHF NZDJPY NZDUSD USDCAD USDCHF USDJPY'.split(' ');
let data={}, selected='EURAUD';
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
function render(){const root=document.getElementById('grid');root.replaceChildren();for(const pair of PAIRS){const d=data[pair]||{};const btn=document.createElement('button');btn.className='tile'+(pair===selected?' active':'');const strong=document.createElement('strong');strong.textContent=pair;btn.append(strong);for(const [label,val,cls] of [['Top 5 avg (points)',d.average,''],['建议布局',d.suggested,'suggest']]){const div=document.createElement('div');div.className='metric '+cls;const b=document.createElement('b');b.textContent=val==null?'—':fmt(val);const small=document.createElement('small');small.textContent=label;div.append(b,small);btn.append(div)}btn.onclick=()=>{selected=pair;render();showDetail()};root.append(btn)}}
function showDetail(){const d=data[selected]||{};const box=document.getElementById('detail');box.replaceChildren();const h=document.createElement('h2');h.textContent=selected+' / D1 · TOP 5 LARGEST DAILY RANGES';box.append(h);if(!d.top5){const p=document.createElement('p');p.textContent='目前没有可用数据，请等待自动更新。';box.append(p);return}const s=document.createElement('div');s.className='summary';s.textContent='Top 5 average: '+fmt(d.average)+' points  |  建议布局: '+fmt(d.suggested)+' points'+(d.status==='stale'?'（上次成功数据）':'');box.append(s);const t=document.createElement('table');const head=document.createElement('thead');const hr=document.createElement('tr');for(const label of ['RANK','DATE','RANGE (POINTS)','HIGH','LOW']){const th=document.createElement('th');th.textContent=label;hr.append(th)}head.append(hr);t.append(head);const body=document.createElement('tbody');d.top5.forEach((r,i)=>{const tr=document.createElement('tr');for(const val of [i+1,r.date,fmt(r.points),r.high,r.low]){const td=document.createElement('td');td.textContent=val;if(td.cellIndex===2)td.className='points';tr.append(td)}body.append(tr)});t.append(body);box.append(t)}
async function load(){try{const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('not found');const obj=await res.json();data=obj.pairs||{};document.getElementById('status').textContent='上次尝试更新（UTC）：'+(obj.updated_utc||'未知')+' · 数据来源：'+(obj.source||'未知')+' · 请注意过期数据标记';render();showDetail()}catch(e){document.getElementById('status').textContent='尚无自动数据。请先在 GitHub Actions 手动运行首次更新。';render();showDetail()}}load();
</script></body></html>
